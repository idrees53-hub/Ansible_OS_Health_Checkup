---
- name: Create quarterly report directory on control node
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../reports/2026-Q4/data"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true

- name: Build server health report dataset
  ansible.builtin.set_fact:
    hc_report_data:
      server:
        hostname: "{{ ansible_hostname }}"
        inventory_hostname: "{{ inventory_hostname }}"
        fqdn: "{{ ansible_fqdn | default('N/A') }}"
        ip_address: "{{ ansible_default_ipv4.address | default('N/A') }}"
        system_uuid: "{{ hc_system_uuid.stdout | default('N/A') | trim if (hc_system_uuid.rc | default(1)) == 0 else 'N/A' }}"
        latest_package_transaction_date: "{{ (hc_last_package_transaction.stdout | default('') | regex_findall('(?im)^Begin time\\s*:\\s*(.+)$') | first) | default('N/A', true) }}"
        latest_package_transaction_command: "{{ (hc_last_package_transaction.stdout | default('') | regex_findall('(?im)^Command Line\\s*:\\s*(.+)$') | first) | default('N/A', true) }}"
        os: "{{ ansible_distribution | default('N/A') }}"
        os_version: "{{ ansible_distribution_version | default('N/A') }}"
        kernel: "{{ ansible_kernel | default('N/A') }}"
        architecture: "{{ ansible_architecture | default('N/A') }}"
        uptime_days: "{{ uptime_days | default(0) }}"

      health:
        overall_status: "{{ hc_overall_status }}"
        critical: "{{ hc_critical_count | int }}"
        warning: "{{ hc_warning_count | int }}"
        info: "{{ hc_info_count | int }}"
        ok: "{{ hc_ok_count | int }}"
        total: "{{ hc_all_findings | length }}"

      findings: "{{ hc_all_findings }}"

- name: Write server JSON health report
  ansible.builtin.copy:
    content: "{{ hc_report_data | to_nice_json }}"
    dest: "{{ playbook_dir }}/../reports/2026-Q4/data/{{ inventory_hostname | regex_replace('[^A-Za-z0-9_.-]', '_') }}.json"
    mode: "0644"
  delegate_to: localhost
  become: false
