---
# ============================================================
# STC RHEL OS HEALTH CHECK
# MEMORY HEALTH ASSESSMENT
#
# Purpose:
#   Analyze the memory dataset collected by memory.yml.
#
# Finding schema:
#   category
#   id
#   severity
#   message
#   evidence
#   impact
#   diagnostic_commands
#   root_cause_checks
#   remediation
#   recommendation
#
# This file ONLY assesses collected data.
# It does NOT collect or execute diagnostic commands.
# ============================================================


# ============================================================
# 1. INITIALIZE MEMORY FINDINGS
# ============================================================

- name: Initialize memory health findings
  ansible.builtin.set_fact:
    hc_memory_findings: []


# ============================================================
# 2. MEMORY UTILIZATION
# ============================================================

- name: Assess memory utilization
  ansible.builtin.set_fact:
    hc_memory_findings: >-
      {{
        hc_memory_findings +
        [
          {
            'category': 'memory',
            'id': 'memory_utilization',

            'severity':
              'CRITICAL'
              if (hc_memory_data.utilization_percent | float)
                 >= (health_check.memory.utilization.critical_percent | float)
              else
              'WARNING'
              if (hc_memory_data.utilization_percent | float)
                 >= (health_check.memory.utilization.warning_percent | float)
              else
              'OK',

            'message':
              'Memory utilization is '
              ~ (hc_memory_data.utilization_percent | float | round(2) | string)
              ~ '%.',

            'evidence':
              'Total memory: '
              ~ (hc_memory_data.total_mb | int | string)
              ~ ' MB; available memory: '
              ~ (hc_memory_data.available_mb | int | string)
              ~ ' MB; utilization: '
              ~ (hc_memory_data.utilization_percent | float | round(2) | string)
              ~ '%.',

            'impact':
              'High sustained memory utilization can lead to memory pressure, swapping, application performance degradation, or out-of-memory events.'
              if (hc_memory_data.utilization_percent | float)
                 >= (health_check.memory.utilization.warning_percent | float)
              else
              'Current memory utilization is within the configured threshold.',

            'diagnostic_commands':
              [
                'free -h',
                'ps -eo pid,ppid,cmd,%mem,%cpu --sort=-%mem | head -n 6',
                'vmstat 1 5'
              ]
              if (hc_memory_data.utilization_percent | float)
                 >= (health_check.memory.utilization.warning_percent | float)
              else [],

            'root_cause_checks':
              [
                'Identify the processes consuming the most memory.',
                'Check whether high memory usage is sustained or temporary.',
                'Determine whether the workload is expected for this server.',
                'Check for memory pressure or active swapping.',
                'Review application memory usage and possible memory leaks.'
              ]
              if (hc_memory_data.utilization_percent | float)
                 >= (health_check.memory.utilization.warning_percent | float)
              else [],

            'remediation':
              [
                'Investigate the highest memory-consuming processes before restarting or terminating them.',
                'Review application configuration and memory consumption.',
                'Investigate possible memory leaks if usage continuously increases.',
                'Consider workload tuning or additional RAM if sustained high utilization is expected.'
              ]
              if (hc_memory_data.utilization_percent | float)
                 >= (health_check.memory.utilization.warning_percent | float)
              else [],

            'recommendation':
              'Investigate memory-consuming processes and memory pressure. Consider workload tuning or additional memory if high utilization persists.'
              if (hc_memory_data.utilization_percent | float)
                 >= (health_check.memory.utilization.warning_percent | float)
              else
              'No action required. Continue routine memory monitoring.'
          }
        ]
      }}


# ============================================================
# 3. SWAP UTILIZATION
# ============================================================

- name: Assess swap utilization
  ansible.builtin.set_fact:
    hc_memory_findings: >-
      {{
        hc_memory_findings +
        [
          {
            'category': 'memory',
            'id': 'swap_utilization',

            'severity':
              'CRITICAL'
              if (hc_memory_data.swap.utilization_percent | float)
                 >= (health_check.memory.swap.critical_percent | float)
              else
              'WARNING'
              if (hc_memory_data.swap.utilization_percent | float)
                 >= (health_check.memory.swap.warning_percent | float)
              else
              'OK',

            'message':
              'Swap utilization is '
              ~ (hc_memory_data.swap.utilization_percent | float | round(2) | string)
              ~ '%.',

            'evidence':
              'Swap total: '
              ~ (hc_memory_data.swap.total_mb | int | string)
              ~ ' MB; swap used: '
              ~ (hc_memory_data.swap.used_mb | int | string)
              ~ ' MB; swap utilization: '
              ~ (hc_memory_data.swap.utilization_percent | float | round(2) | string)
              ~ '%.',

            'impact':
              'High swap utilization can indicate memory pressure and may increase application latency because disk-backed memory is slower than RAM.'
              if (hc_memory_data.swap.utilization_percent | float)
                 >= (health_check.memory.swap.warning_percent | float)
              else
              'Current swap utilization is within the configured threshold.',

            'diagnostic_commands':
              [
                'free -h',
                'swapon --show',
                'vmstat 1 5'
              ]
              if (hc_memory_data.swap.utilization_percent | float)
                 >= (health_check.memory.swap.warning_percent | float)
              else [],

            'root_cause_checks':
              [
                'Check available and used physical memory.',
                'Identify processes consuming significant memory.',
                'Check whether swap activity is currently occurring.',
                'Determine whether swap usage is sustained or historical.',
                'Review whether the server has sufficient RAM for its workload.'
              ]
              if (hc_memory_data.swap.utilization_percent | float)
                 >= (health_check.memory.swap.warning_percent | float)
              else [],

            'remediation':
              [
                'Investigate memory-consuming processes.',
                'Reduce unnecessary memory consumption where possible.',
                'Tune application workloads if excessive memory usage is identified.',
                'Consider additional RAM if sustained memory pressure is confirmed.'
              ]
              if (hc_memory_data.swap.utilization_percent | float)
                 >= (health_check.memory.swap.warning_percent | float)
              else [],

            'recommendation':
              'Investigate memory pressure and identify processes consuming significant memory. Review whether additional RAM or workload tuning is required.'
              if (hc_memory_data.swap.utilization_percent | float)
                 >= (health_check.memory.swap.warning_percent | float)
              else
              'No action required. Continue routine swap monitoring.'
          }
        ]
      }}


# ============================================================
# 4. EXTRACT LATEST SWAP ACTIVITY
# ============================================================

- name: Extract latest swap activity
  ansible.builtin.set_fact:
    hc_memory_swap_in: >-
      {{
        (
          hc_memory_data.swap_activity.raw[-1].split()[6]
          | int
        )
      }}

    hc_memory_swap_out: >-
      {{
        (
          hc_memory_data.swap_activity.raw[-1].split()[7]
          | int
        )
      }}


# ============================================================
# 5. ASSESS SWAP ACTIVITY
# ============================================================

- name: Assess swap activity
  ansible.builtin.set_fact:
    hc_memory_findings: >-
      {{
        hc_memory_findings +
        [
          {
            'category': 'memory',
            'id': 'swap_activity',

            'severity':
              'CRITICAL'
              if (
                (hc_memory_swap_in | int)
                >= (health_check.memory.swap_activity.critical_threshold | int)
                or
                (hc_memory_swap_out | int)
                >= (health_check.memory.swap_activity.critical_threshold | int)
              )
              else
              'WARNING'
              if (
                (hc_memory_swap_in | int)
                >= (health_check.memory.swap_activity.warning_threshold | int)
                or
                (hc_memory_swap_out | int)
                >= (health_check.memory.swap_activity.warning_threshold | int)
              )
              else
              'OK',

            'message':
              'Current swap activity: '
              ~ 'swap-in='
              ~ (hc_memory_swap_in | int | string)
              ~ ', swap-out='
              ~ (hc_memory_swap_out | int | string)
              ~ '.',

            'evidence':
              'vmstat latest sample: swap-in='
              ~ (hc_memory_swap_in | int | string)
              ~ ', swap-out='
              ~ (hc_memory_swap_out | int | string)
              ~ '.',

            'impact':
              'Active swapping can indicate memory pressure and may cause application performance degradation.'
              if (
                (hc_memory_swap_in | int)
                >= (health_check.memory.swap_activity.warning_threshold | int)
                or
                (hc_memory_swap_out | int)
                >= (health_check.memory.swap_activity.warning_threshold | int)
              )
              else
              'No significant swap activity was detected during the sampling period.',

            'diagnostic_commands':
              [
                'free -h',
                'vmstat 1 5',
                'ps -eo pid,ppid,cmd,%mem,%cpu --sort=-%mem | head -n 6'
              ]
              if (
                (hc_memory_swap_in | int)
                >= (health_check.memory.swap_activity.warning_threshold | int)
                or
                (hc_memory_swap_out | int)
                >= (health_check.memory.swap_activity.warning_threshold | int)
              )
              else [],

            'root_cause_checks':
              [
                'Check physical memory availability.',
                'Identify memory-intensive processes.',
                'Determine whether swap activity is sustained.',
                'Check whether application workload recently increased.',
                'Review historical memory pressure if monitoring data is available.'
              ]
              if (
                (hc_memory_swap_in | int)
                >= (health_check.memory.swap_activity.warning_threshold | int)
                or
                (hc_memory_swap_out | int)
                >= (health_check.memory.swap_activity.warning_threshold | int)
              )
              else [],

            'remediation':
              [
                'Investigate and reduce excessive memory consumption.',
                'Review application memory configuration.',
                'Tune workloads causing sustained memory pressure.',
                'Add memory capacity if sustained swapping is confirmed.'
              ]
              if (
                (hc_memory_swap_in | int)
                >= (health_check.memory.swap_activity.warning_threshold | int)
                or
                (hc_memory_swap_out | int)
                >= (health_check.memory.swap_activity.warning_threshold | int)
              )
              else [],

            'recommendation':
              'Investigate memory pressure and identify processes consuming memory if sustained swap activity is observed.'
              if (
                (hc_memory_swap_in | int)
                >= (health_check.memory.swap_activity.warning_threshold | int)
                or
                (hc_memory_swap_out | int)
                >= (health_check.memory.swap_activity.warning_threshold | int)
              )
              else
              'No action required. No significant swap activity was detected.'
          }
        ]
      }}


# ============================================================
# 6. OOM EVENTS
# ============================================================

- name: Assess OOM events
  ansible.builtin.set_fact:
    hc_memory_findings: >-
      {{
        hc_memory_findings +
        [
          {
            'category': 'memory',
            'id': 'oom_event',
            'severity': 'CRITICAL',

            'message':
              'Out-of-memory activity was detected in the current boot journal.',

            'evidence':
              hc_memory_data.oom.evidence,

            'impact':
              'The Linux kernel may have terminated one or more processes because available memory was exhausted.',

            'diagnostic_commands':
              [
                "journalctl -k -b --no-pager | grep -Ei 'out of memory|oom|killed process'",
                'free -h',
                'ps -eo pid,ppid,cmd,%mem,%cpu --sort=-%mem | head -n 6'
              ],

            'root_cause_checks':
              [
                'Identify the process terminated by the OOM killer.',
                'Review memory consumption immediately before the OOM event if historical monitoring is available.',
                'Check whether the server has sufficient physical memory.',
                'Review application memory limits and configuration.',
                'Check for possible application memory leaks.'
              ],

            'remediation':
              [
                'Investigate the terminated process and associated application workload.',
                'Correct application memory leaks or excessive memory consumption.',
                'Review and adjust application memory limits where appropriate.',
                'Consider increasing available RAM if capacity is insufficient.',
                'Implement monitoring and alerting for recurring memory pressure.'
              ],

            'recommendation':
              'Investigate the OOM event immediately. Identify the terminated process, review memory consumption and application limits, and determine whether additional memory capacity is required.'
          }
        ]
      }}
  when:
    - health_check.memory.oom.critical | bool
    - hc_memory_data.oom.detected | bool


# ============================================================
# 7. PSI INFORMATION
# ============================================================

- name: Add memory PSI information
  ansible.builtin.set_fact:
    hc_memory_findings: >-
      {{
        hc_memory_findings +
        [
          {
            'category': 'memory',
            'id': 'memory_psi',
            'severity': 'INFO',

            'message':
              'Memory Pressure Stall Information (PSI) is available.',

            'evidence':
              hc_memory_data.psi.raw,

            'impact':
              'Memory PSI can provide additional visibility into time spent waiting for memory resources.',

            'diagnostic_commands': [],

            'root_cause_checks': [],

            'remediation': [],

            'recommendation':
              'Use memory PSI metrics for deeper memory-pressure analysis when investigating performance issues.'
          }
        ]
      }}
  when:
    - hc_memory_data.psi.available | bool


# ============================================================
# 8. DISPLAY MEMORY FINDINGS
# ============================================================

- name: Display memory health findings
  ansible.builtin.debug:
    var: hc_memory_findings


# ============================================================
# 9. MEMORY SUMMARY
# ============================================================

- name: Calculate memory health summary
  ansible.builtin.set_fact:

    hc_memory_critical_count: >-
      {{
        (
          hc_memory_findings
          | selectattr('severity', 'equalto', 'CRITICAL')
          | list
          | length
        ) | int
      }}

    hc_memory_warning_count: >-
      {{
        (
          hc_memory_findings
          | selectattr('severity', 'equalto', 'WARNING')
          | list
          | length
        ) | int
      }}

    hc_memory_info_count: >-
      {{
        (
          hc_memory_findings
          | selectattr('severity', 'equalto', 'INFO')
          | list
          | length
        ) | int
      }}

    hc_memory_ok_count: >-
      {{
        (
          hc_memory_findings
          | selectattr('severity', 'equalto', 'OK')
          | list
          | length
        ) | int
      }}


# ============================================================
# 10. DETERMINE MEMORY HEALTH
# ============================================================

- name: Determine memory health status
  ansible.builtin.set_fact:
    hc_memory_status: >-
      {{
        'CRITICAL'
        if (hc_memory_critical_count | int) > 0
        else
        'WARNING'
        if (hc_memory_warning_count | int) > 0
        else
        'OK'
      }}


# ============================================================
# 11. DISPLAY MEMORY HEALTH
# ============================================================

- name: Display memory health summary
  ansible.builtin.debug:
    msg:
      - "=================================================="
      - "MEMORY HEALTH"
      - "=================================================="
      - "Memory Health: {{ hc_memory_status }}"
      - "CRITICAL Findings: {{ hc_memory_critical_count }}"
      - "WARNING Findings: {{ hc_memory_warning_count }}"
      - "INFO Findings: {{ hc_memory_info_count }}"
      - "OK Findings: {{ hc_memory_ok_count }}"
      - "=================================================="
